name: Publicar jogo Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para publicar'
        required: true
        default: 'v1.4.0'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruir o ZIP e verificar todos os hashes
        run: python3 scripts/restore-windows.py
      - name: Publicar o executável e a prévia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Iron Crown $RELEASE_TAG — Cerco das Feras" --notes-file "docs/RELEASE-$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release/IronCrown-Windows-x64.zip release/IronCrown-Windows-x64.zip.sha256 preview/previa-pc.mp4 docs/PC-LEIA-ME.txt --clobber
